<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">codex-unpacker Execution Pipeline</title>
  <desc id="arch-desc">Four-stage pipeline: Probe Manifest, Resolve Package, Verify SHA256, and Inspect/Save.</desc>
  <defs>
    <linearGradient id="pipe-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B0E14"/>
      <stop offset="100%" stop-color="#131721"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="200" rx="16" fill="url(#pipe-bg)"/>
  <rect width="1200" height="200" rx="16" fill="none" stroke="#00ADD8" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Step 1: Probe -->
  <g transform="translate(30, 32)">
    <rect width="245" height="136" rx="12" fill="#131721" stroke="#FFB020" stroke-width="1.5"/>
    <rect x="14" y="14" width="30" height="30" rx="6" fill="#FFB020" fill-opacity="0.2" stroke="#FFB020" stroke-width="1"/>
    <text x="29" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#FFB020" text-anchor="middle">1</text>

    <text x="54" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#E6EDF3">PROBE MANIFEST</text>
    <text x="14" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8B949E">Checks official Codex</text>
    <text x="14" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8B949E">update manifest for</text>
    <text x="14" y="112" font-family="ui-monospace, monospace" font-size="12" fill="#FFB020">Windows &amp; macOS</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <g transform="translate(285, 86)">
    <path d="M 0 15 L 18 15 M 13 9 L 19 15 L 13 21" fill="none" stroke="#00ADD8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Step 2: Resolve -->
  <g transform="translate(315, 32)">
    <rect width="245" height="136" rx="12" fill="#131721" stroke="#00ADD8" stroke-width="1.5"/>
    <rect x="14" y="14" width="30" height="30" rx="6" fill="#00ADD8" fill-opacity="0.2" stroke="#00ADD8" stroke-width="1"/>
    <text x="29" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#00ADD8" text-anchor="middle">2</text>

    <text x="54" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#E6EDF3">RESOLVE PACKAGE</text>
    <text x="14" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8B949E">Resolves matching MSIX</text>
    <text x="14" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8B949E">or DMG download target</text>
    <text x="14" y="112" font-family="ui-monospace, monospace" font-size="12" fill="#00ADD8">for host or --platform</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <g transform="translate(570, 86)">
    <path d="M 0 15 L 18 15 M 13 9 L 19 15 L 13 21" fill="none" stroke="#00ADD8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Step 3: Verify -->
  <g transform="translate(600, 32)">
    <rect width="265" height="136" rx="12" fill="#131721" stroke="#00D26A" stroke-width="1.5"/>
    <rect x="14" y="14" width="30" height="30" rx="6" fill="#00D26A" fill-opacity="0.2" stroke="#00D26A" stroke-width="1"/>
    <text x="29" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#00D26A" text-anchor="middle">3</text>

    <text x="54" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#E6EDF3">VERIFY SHA256</text>
    <text x="14" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8B949E">Validates MSIX structure,</text>
    <text x="14" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8B949E">macOS DMG integrity,</text>
    <text x="14" y="112" font-family="ui-monospace, monospace" font-size="12" fill="#00D26A">and computes checksum</text>
  </g>

  <!-- Arrow 3 to 4 -->
  <g transform="translate(875, 86)">
    <path d="M 0 15 L 18 15 M 13 9 L 19 15 L 13 21" fill="none" stroke="#00ADD8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Step 4: Inspect / Save -->
  <g transform="translate(905, 32)">
    <rect width="265" height="136" rx="12" fill="#131721" stroke="#00ADD8" stroke-width="1.5"/>
    <rect x="14" y="14" width="30" height="30" rx="6" fill="#00ADD8" stroke="#00ADD8" stroke-width="1"/>
    <text x="29" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#0B0E14" text-anchor="middle">4</text>

    <text x="54" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#E6EDF3">INSPECT / SAVE</text>
    <text x="14" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8B949E">Saves to Downloads or</text>
    <text x="14" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8B949E">inspects local packages</text>
    <text x="14" y="112" font-family="ui-monospace, monospace" font-size="12" fill="#00ADD8">state in data/latest.json</text>
  </g>
</svg>
