<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">codex-unpacker - Terminal-first Go package resolver for Codex</title>
  <desc id="desc">Terminal-first Go application for probing, downloading, and inspecting Codex MSIX and DMG packages.</desc>
  <defs>
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E14"/>
      <stop offset="100%" stop-color="#131721"/>
    </linearGradient>
    <linearGradient id="panel-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131721"/>
      <stop offset="100%" stop-color="#0B0E14"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="340" rx="16" fill="url(#hero-bg)"/>
  <rect width="1200" height="340" rx="16" fill="none" stroke="#00ADD8" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Left Column: Branding & Information (No Pills, No Eyebrow Tags) -->
  <g transform="translate(60, 52)">
    <!-- Main Title -->
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" fill="#E6EDF3" letter-spacing="-1">codex-unpacker</text>

    <!-- Subtitle -->
    <text x="0" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#8B949E" font-weight="400">Terminal-first Go resolver to probe, download,</text>
    <text x="0" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#8B949E" font-weight="400">and verify Codex MSIX and DMG packages.</text>

    <!-- Run Command Box -->
    <g transform="translate(0, 168)">
      <rect width="436" height="48" rx="8" fill="#131721" stroke="#00ADD8" stroke-width="1" stroke-opacity="0.4"/>
      <text x="16" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#00ADD8" font-weight="700">$</text>
      <text x="32" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#E6EDF3" font-weight="600">codex-unpacker probe --platform macos</text>
    </g>
  </g>

  <!-- Right Column: Interactive Terminal Mockup -->
  <g transform="translate(560, 44)">
    <rect width="580" height="252" rx="12" fill="url(#panel-bg)"/>
    <rect width="580" height="252" rx="12" fill="none" stroke="#00ADD8" stroke-width="1.5" stroke-opacity="0.4"/>

    <!-- Window Titlebar -->
    <path d="M 0,12 A 12,12 0 0,1 12,0 L 568,0 A 12,12 0 0,1 580,12 L 580,36 L 0,36 Z" fill="#0B0E14"/>
    <line x1="0" y1="36" x2="580" y2="36" stroke="#00ADD8" stroke-width="1" stroke-opacity="0.2"/>
    
    <circle cx="20" cy="18" r="5" fill="#FF5F56"/>
    <circle cx="36" cy="18" r="5" fill="#FFB020"/>
    <circle cx="52" cy="18" r="5" fill="#00D26A"/>
    <text x="290" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8B949E" text-anchor="middle">codex-unpacker TUI inspection console</text>

    <!-- Terminal Lines -->
    <g transform="translate(24, 56)">
      <!-- Line 1: Command -->
      <text x="0" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#00ADD8" font-weight="bold">$ <tspan fill="#E6EDF3">codex-unpacker inspect Codex-arm64.dmg</tspan></text>

      <!-- Line 2: Target -->
      <g transform="translate(0, 44)">
        <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8B949E">Resolved Package</text>
        <text x="150" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#E6EDF3">Codex-26.609.41114-arm64.dmg</text>
      </g>

      <!-- Line 3: Version -->
      <g transform="translate(0, 72)">
        <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8B949E">Manifest Version</text>
        <text x="150" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#FFB020">v26.609.41114</text>
      </g>

      <!-- Line 4: SHA256 -->
      <g transform="translate(0, 100)">
        <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8B949E">SHA256 Hash</text>
        <text x="150" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#00ADD8">a8f9c2d1e0b...3d4f5e6a</text>
      </g>

      <!-- Line 5: Status PASS -->
      <g transform="translate(0, 134)">
        <rect width="52" height="20" rx="4" fill="#00D26A"/>
        <text x="26" y="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#0B0E14" text-anchor="middle">PASS</text>
        <text x="64" y="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#00D26A">Package integrity &amp; structure verified</text>
      </g>
    </g>
  </g>
</svg>
